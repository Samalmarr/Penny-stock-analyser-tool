              "@type": "Answer",
              "text": "A 5-letter ticker ending in the letter 'Q' (such as BBBYQ or SHLDQ) indicates the company is in Chapter 11 or Chapter 7 federal bankruptcy proceedings. Existing common equity is typically extinguished with 100% permanent loss."

            "@type": "Question",
            "name": "What is toxic stock dilution in penny stocks?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Toxic dilution occurs when micro-cap issuers fund operations by issuing variable-rate convertible debt with death-spiral conversion discounts. As noteholders convert debt into millions of new shares, outstanding share count skyrockets and price per share collapses."
            }
          },
